name: keystore
on: workflow_dispatch
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Generate release keystore
        run: |
          PW="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)"
          echo "::add-mask::$PW"
          printf '%s' "$PW" > passwords.txt
          printf '\n%s' "omniroute" >> passwords.txt
          keytool -genkeypair -keystore keystore.jks -alias omniroute -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -dname "CN=OmniRoute"
          base64 -w0 keystore.jks > keystore.b64
          unset PW
      - uses: actions/upload-artifact@v4
        with: { name: keystore, path: "keystore.b64\npasswords.txt" }
