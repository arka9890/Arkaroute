name: keystore
# ONE-SHOT CONSUMED 2026-11-08: this workflow was never dispatchable from a
# non-default branch (GitHub resolves workflow filenames against the default
# branch), so the keystore was generated once LOCALLY with these exact
# parameters (RSA 2048, alias omniroute, CN=OmniRoute, 24-char random password)
# and stored as repo secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS.
# DO NOT DISPATCH this workflow: re-running rotates the signing key and breaks
# update-in-place for installed devices.
on: workflow_dispatch
jobs:
  generate:
    # Guarded so the job is a permanent no-op even if the workflow is ever
    # dispatched (GitHub would allow it once merged to a default branch).
    # The generation ran exactly once on 2026-11-08 (see ONE-SHOT note above).
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Generate release keystore
        run: |
          PW="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)"
          echo "::add-mask::$PW"
          printf '%s' "$PW" > passwords.txt
          printf '\n%s' "omniroute" >> passwords.txt
          keytool -genkeypair -keystore keystore.jks -alias omniroute -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -dname "CN=OmniRoute"
          base64 -w0 keystore.jks > keystore.b64
          unset PW
      - uses: actions/upload-artifact@v4
        with: { name: keystore, path: "keystore.b64\npasswords.txt" }
