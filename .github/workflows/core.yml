name: core

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Test
        run: cargo test --manifest-path core/Cargo.toml
      - name: Test bridge
        run: cargo test --manifest-path bridge/Cargo.toml
